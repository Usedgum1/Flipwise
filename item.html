            </div>
            <nav class="nav-section">
                <a href="index.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>

                    Dashboard
                </a>
                <a href="markets.html" class="nav-item">

                    Markets
                </a>
                <a href="scanner.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    Trade Scanner
                </a>
                <a href="money-makers.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
                    </svg>
                    Unusual Methods
                </a>
                <a href="enchanting.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2z"/><path d="M6 18l2-2 2 2 2-2 2 2"/>

                </a>

                <a href="tree-saplings.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22v-8M12 14c-2-2-5-3-8-2-1 3-1 6 2 8M12 14c2-2 5-3 8-2 1 3 1 6-2 8M12 8c-2-1-4-1-6 0-1 2 0 4 2 5M12 8c2-1 4-1 6 0 1 2 0 4-2 5"/>

        </aside>

        <main class="main-content item-page">
            <div class="item-page-header">
                <button type="button" class="item-page-back" onclick="history.back()">← Back</button>
                <div class="item-page-title-row">
                    <div id="itemPageIcon" class="item-page-icon"></div>
                    <div>
                        <h1 id="itemPageName">Loading…</h1>
                        <p id="itemPageMeta" class="text-muted"></p>
                    </div>
                </div>
            </div>

            <div id="itemPageStats" class="item-page-stats"></div>

            <div class="item-page-actions">
                <a id="itemPageWikiLink" class="item-page-action-btn" href="#" target="_blank" rel="noopener noreferrer">Wiki</a>
                <button type="button" class="item-page-action-btn" id="itemAlertBuyBtn">Set buy alert</button>
                <button type="button" class="item-page-action-btn" id="itemAlertSellBtn">Set sell alert</button>
            </div>

            <div class="card item-page-chart-card">
                <div class="flipwise-breakdown-chart-header">
                    <span class="flipwise-breakdown-chart-label">Price history</span>
                    <div class="flipwise-breakdown-chart-tabs" id="itemChartTabs">
                        <button type="button" class="chart-tab" data-lookback="5m">5m</button>
                        <button type="button" class="chart-tab" data-lookback="24h">24h</button>
                        <button type="button" class="chart-tab active" data-lookback="7d">7d</button>
                        <button type="button" class="chart-tab" data-lookback="30d">30d</button>
                    </div>
                </div>
                <div id="itemPageChart" class="flipwise-breakdown-chart" aria-live="polite">
                    <div class="flipwise-chart-placeholder text-muted">Loading chart…</div>
                </div>
            </div>

            <footer class="copyright">
                Copyright &copy; 2026 Flipwise by MinMax Technology
            </footer>
        </main>
    </div>

    <script src="js/sidebar-clock.js"></script>

    <script src="js/flipwise-sounds.js"></script>
    <script src="js/flipwise-alerts.js"></script>

    <script src="js/flipwise-charts.js"></script>
    <script src="js/flipwise-item-page.js"></script>
